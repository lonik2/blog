{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Portafolio aura{% endblock %}</title>
    <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@500;600;700;800&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔵</text></svg>">
</head>
<body>
    <input type="checkbox" id="theme-toggle" class="theme-toggle-input">
    <header class="topnav">
        <nav aria-label="Navegación principal">
            <ul>
            <li><a href="{% url 'home' %}#inicio">Inicio</a></li>
            <li><a href="{% url 'home' %}#sobre-mi">Sobre mi</a></li>
            <li><a href="{% url 'home' %}#proyectos">Proyectos</a></li>
            <li><a href="{% url 'home' %}#contacto">Contactos</a></li>
            <li><a href="{% url 'blog_index' %}">Blog</a></li>
            </ul>
        </nav>
        <label for="theme-toggle" class="theme-toggle-label" aria-label="Cambiar entre modo claro y oscuro">
            <i class="bi bi-sun"></i>
            <i class="bi bi-moon-stars"></i>
        </label>
    </header>
 
    <main>
        {% block content %}
            {% block page_title %}{% endblock page_title %}
            {% block page_content %}{% endblock page_content %}
        {% endblock content %}
    </main>
</body>
</html>
